# Deploy with `bin/kamal setup` (first time) or `bin/kamal deploy`. Nothing about your server lives
# in this file: export these before running Kamal (a .envrc or your shell profile works).
#   KAMAL_HOST      server IP or hostname, reachable over SSH as root
#   APP_HOST        public domain, already pointing at KAMAL_HOST (kamal-proxy gets its certificate)
#   MAIL_FROM, SMTP_ADDRESS, SMTP_USERNAME                       outgoing email
#   ADMIN_EMAILS    comma-separated; these signed-in users see /admin/errors and /admin/jobs,
#                   and get an email for every new error
#   BACKUP_S3_ENDPOINT, BACKUP_S3_REGION, BACKUP_S3_BUCKET       S3-compatible storage for backups
# Secrets are listed in .kamal/secrets.
service: rails-vue-starter
image: rails-vue-starter

servers:
  web:
    - <%= ENV.fetch("KAMAL_HOST") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("APP_HOST") %>

# Kamal's local registry: the image goes to the server over SSH, no Docker Hub account needed.
registry:
  server: localhost:5555

env:
  secret:
    - SECRET_KEY_BASE
    - POSTGRES_PASSWORD
    - SMTP_PASSWORD
  clear:
    APP_HOST: <%= ENV.fetch("APP_HOST") %>
    ADMIN_EMAILS: <%= ENV.fetch("ADMIN_EMAILS") %>
    DB_HOST: rails-vue-starter-db
    MAIL_FROM: <%= ENV.fetch("MAIL_FROM") %>
    SMTP_ADDRESS: <%= ENV.fetch("SMTP_ADDRESS") %>
    SMTP_USERNAME: <%= ENV.fetch("SMTP_USERNAME") %>
    # Run the Solid Queue supervisor inside Puma; move it to its own role when jobs need their own server.
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  backup: accessory exec backup --reuse "sh backup.sh"
  backup-drill: accessory exec backup --reuse "sh /backup_drill.sh"
  # Destructive: restores the latest backup OVER the live database. Run backup-drill first.
  restore: accessory exec backup --reuse "sh restore.sh"

asset_path: /rails/public

builder:
  arch: amd64

accessories:
  db:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    host: <%= ENV.fetch("KAMAL_HOST") %>
    env:
      clear:
        POSTGRES_USER: rails_vue_starter
        POSTGRES_DB: rails_vue_starter_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql

  # Daily encrypted dump of the primary database. `bin/kamal backup` takes one now,
  # `bin/kamal backup-drill` proves the latest restores (into a scratch database), and
  # `bin/kamal restore` restores it over the live database. Cache, queue and cable are not backed up.
  backup:
    image: ardakilic/postgres-backup-s3:18@sha256:b9adc8dfcdea4c85dd972920cacefe26e83ddddf8ce2cad1433a3a4eca3bf193
    host: <%= ENV.fetch("KAMAL_HOST") %>
    env:
      clear:
        SCHEDULE: "@daily"
        BACKUP_KEEP_DAYS: 14
        S3_ENDPOINT: <%= ENV.fetch("BACKUP_S3_ENDPOINT") %>
        S3_REGION: <%= ENV.fetch("BACKUP_S3_REGION") %>
        S3_BUCKET: <%= ENV.fetch("BACKUP_S3_BUCKET") %>
        S3_PREFIX: rails-vue-starter
        POSTGRES_HOST: rails-vue-starter-db
        POSTGRES_DATABASE: rails_vue_starter_production
        POSTGRES_USER: rails_vue_starter
      secret:
        - POSTGRES_PASSWORD
        - S3_ACCESS_KEY_ID
        - S3_SECRET_ACCESS_KEY
        - PASSPHRASE
    files:
      - script/backup_drill.sh:/backup_drill.sh
