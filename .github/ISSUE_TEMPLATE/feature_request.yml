name: Feature request
description: Something most new apps need that the template is missing.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: The situation in a real app where you missed it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you add?
      description: The smallest version that solves the problem, and whether it should be on by default or a documented option.
    validations:
      required: true
