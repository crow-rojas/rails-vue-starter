name: CI

on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Run bin/ci
        run: bin/ci

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  pr_size:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'large-pr')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fail on pull requests too large to review
        env:
          BASE_REF: ${{ github.base_ref }}
          MAX_LINES: 800
        run: |
          lines=$(git diff --numstat "origin/$BASE_REF...HEAD" -- . ':!Gemfile.lock' ':!pnpm-lock.yaml' ':!app/javascript/routes' ':!app/javascript/types/serializers' | awk '{ total += $1 + $2 } END { print total + 0 }')
          echo "$lines changed lines (limit $MAX_LINES, lockfiles and generated types excluded)"
          if [ "$lines" -gt "$MAX_LINES" ]; then
            echo "Split this pull request, or add the large-pr label when it cannot be split."
            exit 1
          fi
