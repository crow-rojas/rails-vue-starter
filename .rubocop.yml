# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

AllCops:
  NewCops: enable

# Omakase turns off every department but style. These catch bugs, not taste.
Lint:
  Enabled: true
Rails:
  Enabled: true
Performance:
  Enabled: true

# Fix the code or propose an ADR; never silence a cop inline.
Style/DisableCopsWithinSourceCodeDirective:
  Enabled: true

# Turned on by the i18n baseline, which moves flash and mailer copy to locale files.
Rails/I18nLocaleTexts:
  Enabled: false
